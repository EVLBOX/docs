version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "jeeringsole"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
